<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<title>🏆 سباق الكلمات الإنجليزية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap');
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--primary:#2563eb;--primary2:#1d4ed8;--success:#16a34a;--danger:#dc2626;--warn:#d97706;--border:#e5e7eb;--shadow:0 12px 35px rgba(15,23,42,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Cairo,Tajawal,system-ui,sans-serif}body{padding:16px}button,input{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.48;cursor:not-allowed}.app{max-width:760px;margin:auto}.card{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}.hero{text-align:center;padding:30px 20px}.logo{font-size:52px;margin-bottom:8px}.title{font-size:30px;font-weight:800;margin:0 0 8px}.subtitle{color:var(--muted);margin:0 0 24px}.actions{display:grid;gap:10px}.btn{min-height:52px;border-radius:15px;padding:12px 18px;font-weight:800;transition:.15s}.btn.primary{background:var(--primary);color:#fff}.btn.primary:active{transform:scale(.98);background:var(--primary2)}.btn.secondary{background:#eef2ff;color:#1e40af}.btn.ghost{background:#f3f4f6;color:#374151}.btn.danger{background:#fee2e2;color:#991b1b}.nameRow{display:flex;gap:8px;margin:14px 0}.nameRow input{flex:1}.input{width:100%;min-height:52px;border:2px solid var(--border);border-radius:15px;padding:12px 14px;background:#fff;outline:none}.input:focus{border-color:var(--primary)}.share{display:grid;grid-template-columns:1fr auto auto;gap:8px}.share input{direction:ltr;font-size:12px}.status{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:12px}.dot{width:11px;height:11px;border-radius:50%;display:inline-block;background:#f59e0b}.dot.green{background:#22c55e}.dot.red{background:#ef4444}.dot.yellow{background:#f59e0b}.hidden{display:none!important}.notice{padding:12px 14px;border-radius:14px;background:#eff6ff;color:#1e40af;margin:10px 0}.notice.error{background:#fef2f2;color:#991b1b}.notice.success{background:#f0fdf4;color:#166534}.notice.warn{background:#fffbeb;color:#92400e}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player{padding:14px;border:2px solid var(--border);border-radius:18px;background:#fafafa}.player.active{border-color:var(--primary);background:#eff6ff}.player .name{font-weight:800}.score{font-size:26px;font-weight:800;margin-top:4px}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.letterBox{text-align:center}.letter{font-size:58px;font-weight:900;line-height:1;color:var(--primary)}.timer{font-size:44px;font-weight:900;direction:ltr;letter-spacing:2px}.turn{text-align:center;font-size:19px;font-weight:800;margin:8px 0}.helpers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.helper{min-height:60px;border-radius:15px;background:#f8fafc;border:1px solid var(--border);font-weight:800;padding:8px}.wordInput{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.words{max-height:300px;overflow:auto;padding-left:2px}.wordGroup{margin:10px 0}.wordGroup h4{margin:0 0 6px;font-size:14px;color:var(--muted)}.wordList{display:flex;flex-wrap:wrap;gap:7px}.chip{direction:ltr;background:#f1f5f9;border-radius:999px;padding:6px 10px;font-weight:700}.letterGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.letterBtn{min-height:50px;border-radius:13px;background:#eff6ff;color:#1d4ed8;font-weight:900}.letterBtn.selected{background:var(--primary);color:#fff}.copyRow{display:grid;grid-template-columns:1fr auto;gap:8px}.winner{text-align:center}.winner .trophy{font-size:62px}.finalScore{font-size:34px;font-weight:900}.small{font-size:12px;color:var(--muted)}.modalBack{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{max-width:430px;width:100%;background:#fff;border-radius:22px;padding:22px;box-shadow:0 25px 60px rgba(0,0,0,.25);text-align:center}.modal h3{margin-top:0}.suggestion{font-size:30px;font-weight:900;direction:ltr;margin:14px 0}.footer{color:#94a3b8;text-align:center;font-size:11px;padding:8px}
@media(max-width:480px){body{padding:10px}.card{padding:15px;border-radius:18px}.title{font-size:25px}.logo{font-size:42px}.timer{font-size:37px}.letter{font-size:50px}.helpers{grid-template-columns:1fr}.wordInput{grid-template-columns:1fr}.wordInput .btn{width:100%}.share{grid-template-columns:1fr}.share .btn{width:100%}.letterGrid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div id="home" class="card hero">
    <div class="logo">🏆</div><h1 class="title">سباق الكلمات الإنجليزية</h1><p class="subtitle">اختبر سرعة مفرداتك الإنجليزية ضد صديقك!</p>
    <div id="homeStatus" class="notice hidden"></div>
    <div class="nameRow"><input id="homeName" class="input" maxlength="20" placeholder="اكتب اسمك (اختياري)"></div>
    <div class="actions"><button id="createBtn" class="btn primary">إنشاء غرفة</button><button id="joinBtn" class="btn secondary hidden">جاري الانضمام...</button></div>
